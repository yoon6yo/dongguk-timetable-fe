apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timetable-fe-ingress
  namespace: timetable
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Per-client-IP rate limit — this is a public repo/API now, so this stops a
    # bot/script hammering /api/courses before it ever reaches the pod or MySQL.
    nginx.ingress.kubernetes.io/limit-rps: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dongguk-timetable.duckdns.org
      secretName: timetable-fe-tls
  rules:
    - host: dongguk-timetable.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: timetable-fe
                port:
                  number: 80
